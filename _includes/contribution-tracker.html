{% assign data = site.data.tracker.records %}

<pre id="ct-data" hidden aria-hidden="true">{{ data | to_json }}</pre>

<style>
  #ct-2026 { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace;
             background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px;
             padding:14px 16px; color:#24292f; }
  #ct-2026 .ct-head { display:flex; justify-content:space-between; flex-wrap:wrap;
                      font-size:12px; color:#57606a; margin-bottom:10px; }
  #ct-2026 .ct-scroll { overflow-x:auto; padding-bottom:4px; }
  #ct-2026 .ct-year-lab { font-size:10px; color:#57606a; margin:12px 0 4px 26px; }
  #ct-2026 .ct-year-block:first-child .ct-year-lab { margin-top:0; }
  #ct-2026 .ct-grid { display:grid; grid-template-rows:14px repeat(7,10px); gap:2px; width:max-content; }
  #ct-2026 .ct-lab { font-size:9px; color:#8b949e; }
  #ct-2026 .ct-cell { width:10px; height:10px; border-radius:3px; cursor:pointer; }
  #ct-2026 .ct-cell:hover { outline:1px solid #57606a; }
  #ct-2026 .ct-today { box-shadow:0 0 0 2px #f6f8fa, 0 0 0 3.5px #58a6ff; }
  #ct-2026 .ct-legend { display:flex; align-items:center; flex-wrap:wrap; gap:5px;
                        margin-top:10px; font-size:10px; color:#57606a; }
  #ct-2026 .ct-swatch { width:10px; height:10px; border-radius:3px; display:inline-block; }
  #ct-2026 .ct-tip { position:fixed; z-index:9999; background:#24292f; color:#e6edf3;
                     font-size:11px; line-height:1.6; padding:8px 10px; border-radius:6px;
                     box-shadow:0 4px 12px rgba(0,0,0,.3); pointer-events:none;
                     white-space:nowrap; display:none; }
  #ct-2026 .ct-tip .ok { color:#3fb950; }
  #ct-2026 .ct-tip .no { color:#8b949e; }
  #ct-2026 .ct-err { font-size:11px; color:#cf222e; grid-column:1/-1; grid-row:3; white-space:pre-wrap; }
</style>

<div id="ct-2026">
  <div class="ct-head">
    <span>~/tracker $ log --from=2026-11-20 --to=today</span>
    <span id="ct-stats"></span>
  </div>
  <div class="ct-scroll">
    <div id="ct-years">
      <div style="font-size:11px;color:#8b949e">building grid&hellip;</div>
    </div>
  </div>
  <div class="ct-legend">
    <span>0/4</span>
    <span class="ct-swatch" style="background:#eac54f"></span>
    <span class="ct-swatch" style="background:#9be9a8"></span>
    <span class="ct-swatch" style="background:#40c463"></span>
    <span class="ct-swatch" style="background:#30a14e"></span>
    <span class="ct-swatch" style="background:#216e39"></span>
    <span>4/4</span>
    <span style="margin-left:8px">white = before start</span>
    <span style="margin-left:8px">grey = upcoming</span>
    <span style="margin-left:8px;color:#58a6ff">ring = today, live in Beijing time</span>
    <span style="margin-left:8px">hover/click a day for details</span>
  </div>
  <div class="ct-tip" id="ct-tip"></div>
</div>

<script src="/assets/js/ct2026.js" defer></script>
