<!-- 365-day marathon bar. Numerator = days since START (2026-11-20) on which at
     least one task was completed ("counted days"); denominator = 365.
     Computed live by assets/js/ct2026.js from the same DATA as the tracker
     grid, so the two can never disagree. The header clock proves the script
     ran; --:-- means it did not. -->
<div id="pbar" style="font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace;
            background:#0d1117; border:1px solid #30363d; border-radius:6px;
            max-width:460px; padding:12px 14px; color:#c9d1d9;">
  <div style="display:flex; justify-content:space-between; font-size:12px;
              color:#8b949e; margin-bottom:8px; letter-spacing:.5px;">
    <span id="pbar-clock">--:--</span>
    <span style="color:#3fb950;" id="pbar-day">000/365</span>
  </div>
  <div style="position:relative; width:100%; height:12px; background:#161b22;
              border:1px solid #30363d; border-radius:3px; overflow:hidden;">
    <div id="pbar-fill" style="width:0%; min-width:0; height:100%;
                background:linear-gradient(90deg,#238636,#3fb950);
                box-shadow:0 0 10px rgba(63,185,80,.6); transition:width .4s;"></div>
  </div>
  <div style="display:flex; justify-content:space-between; font-size:12px;
              margin-top:8px; color:#8b949e;">
    <span id="pbar-pct">0%</span>
    <span id="pbar-remaining">365d to go</span>
  </div>
</div>
