name: tracker-smoke-test
on:
  push:
    paths:
      - '_data/tracker/**'
      - '_includes/contribution-tracker.html'
      - '_includes/progress-bar.html'
      - 'assets/js/ct2026.js'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Ruby deps
        run: bundle install --quiet
      - name: Validate records + built island
        run: node scripts/check-tracker.js